<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="TokyoDev — 東京開発者 · Jhosep S.">
  <defs>
    <clipPath id="frame"><rect width="1200" height="360" rx="18"/></clipPath>
    <clipPath id="groundClip"><rect y="300" width="1200" height="60"/></clipPath>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b12"/>
      <stop offset=".55" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#2d1f45"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset="1" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="groundFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1030" stop-opacity="1"/>
      <stop offset="1" stop-color="#1b1030" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9e64"/>
      <stop offset=".5" stop-color="#f7768e"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#ff007c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff007c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset=".4" stop-color="#7aa2f7"/>
      <stop offset=".75" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#ff007c"/>
    </linearGradient>

    <!-- franjas del sol estilo synthwave -->
    <mask id="sunCut">
      <rect width="1200" height="360" fill="#fff"/>
      <g fill="#000">
        <rect x="760" y="206" width="280" height="3"/>
        <rect x="760" y="221" width="280" height="4"/>
        <rect x="760" y="237" width="280" height="5"/>
        <rect x="760" y="253" width="280" height="7"/>
        <rect x="760" y="270" width="280" height="8"/>
        <rect x="760" y="288" width="280" height="10"/>
      </g>
    </mask>

    <!-- ventanas de los edificios -->
    <pattern id="winB" width="12" height="14" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="5" height="6" fill="#3d59a1" opacity=".45"/>
    </pattern>
    <pattern id="winF" width="36" height="28" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="5" height="7" fill="#e0af68" opacity=".85"/>
      <rect x="17" y="6" width="5" height="7" fill="#7dcfff" opacity=".55"/>
      <rect x="29" y="6" width="5" height="7" fill="#e0af68" opacity=".25"/>
      <rect x="5" y="20" width="5" height="7" fill="#bb9af7" opacity=".5"/>
      <rect x="17" y="20" width="5" height="7" fill="#e0af68" opacity=".15"/>
      <rect x="29" y="20" width="5" height="7" fill="#7dcfff" opacity=".8"/>
    </pattern>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- siluetas (sin color: se pintan dos veces, base + ventanas) -->
    <g id="backCity">
      <rect x="0" y="262" width="70" height="38"/>
      <rect x="75" y="255" width="45" height="45"/>
      <rect x="300" y="258" width="60" height="42"/>
      <rect x="420" y="256" width="50" height="44"/>
      <rect x="520" y="260" width="70" height="40"/>
      <rect x="640" y="212" width="50" height="88"/>
      <rect x="698" y="188" width="40" height="112"/>
      <rect x="744" y="228" width="60" height="72"/>
      <rect x="980" y="198" width="45" height="102"/>
      <rect x="1030" y="172" width="36" height="128"/>
      <rect x="1066" y="222" width="40" height="78"/>
      <rect x="1150" y="205" width="50" height="95"/>
    </g>
    <g id="frontCity">
      <rect x="0" y="276" width="55" height="24"/>
      <rect x="58" y="268" width="40" height="32"/>
      <rect x="102" y="281" width="70" height="19"/>
      <rect x="176" y="272" width="50" height="28"/>
      <rect x="230" y="283" width="60" height="17"/>
      <rect x="294" y="274" width="46" height="26"/>
      <rect x="344" y="285" width="80" height="15"/>
      <rect x="428" y="270" width="40" height="30"/>
      <rect x="472" y="279" width="56" height="21"/>
      <rect x="532" y="266" width="46" height="34"/>
      <rect x="582" y="281" width="44" height="19"/>
      <rect x="630" y="246" width="56" height="54"/>
      <rect x="690" y="224" width="58" height="76"/>
      <rect x="752" y="256" width="70" height="44"/>
      <rect x="826" y="240" width="42" height="60"/>
      <rect x="872" y="263" width="60" height="37"/>
      <rect x="936" y="232" width="52" height="68"/>
      <rect x="992" y="250" width="40" height="50"/>
      <rect x="1036" y="238" width="58" height="62"/>
      <rect x="1098" y="262" width="46" height="38"/>
      <rect x="1148" y="236" width="52" height="64"/>
    </g>
  </defs>

  <style>
    .s{fill:#c0caf5;animation:tw 4s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    .pulse{animation:pulse 5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
    .neon{animation:flick 6s linear infinite}
    @keyframes flick{0%,17%,23%,58%,64%,100%{opacity:1}18%,22%{opacity:.3}60%,62%{opacity:.15}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .beacon{animation:beacon 2s ease-in-out infinite}
    @keyframes beacon{0%,100%{opacity:.15}50%{opacity:1}}
    .mono{font-family:'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace}
    .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
    .jp{font-family:'Yu Gothic UI','Yu Gothic',Meiryo,'Hiragino Sans','Noto Sans JP',sans-serif}
  </style>

  <g clip-path="url(#frame)">
    <!-- cielo y suelo -->
    <rect width="1200" height="300" fill="url(#sky)"/>
    <rect y="300" width="1200" height="60" fill="url(#ground)"/>

    <!-- estrellas -->
    <g>
      <circle class="s" cx="40" cy="30" r="1.2" style="animation-delay:-.4s"/>
      <circle class="s" cx="120" cy="58" r=".9" style="animation-delay:-2.1s"/>
      <circle class="s" cx="610" cy="88" r=".9" style="animation-delay:-1.2s"/>
      <circle class="s" cx="660" cy="24" r="1.3" style="animation-delay:-3.3s"/>
      <circle class="s" cx="720" cy="62" r="1" style="animation-delay:-.9s"/>
      <circle class="s" cx="790" cy="30" r="1.4" style="animation-delay:-2.7s"/>
      <circle class="s" cx="850" cy="76" r=".8" style="animation-delay:-1.6s"/>
      <circle class="s" cx="920" cy="20" r="1.1" style="animation-delay:-3.8s"/>
      <circle class="s" cx="980" cy="56" r="1.3" style="animation-delay:-.2s"/>
      <circle class="s" cx="1040" cy="28" r=".9" style="animation-delay:-2.4s"/>
      <circle class="s" cx="1100" cy="70" r="1.2" style="animation-delay:-1.1s"/>
      <circle class="s" cx="1160" cy="38" r="1" style="animation-delay:-3s"/>
      <circle class="s" cx="1180" cy="120" r=".9" style="animation-delay:-1.9s"/>
      <circle class="s" cx="560" cy="130" r=".8" style="animation-delay:-2.9s"/>
      <circle class="s" cx="700" cy="140" r="1" style="animation-delay:-.6s"/>
      <circle class="s" cx="1010" cy="118" r=".8" style="animation-delay:-3.5s"/>
      <circle class="s" cx="590" cy="40" r="1.1" style="animation-delay:-1.4s"/>
      <circle class="s" cx="470" cy="22" r=".9" style="animation-delay:-2.2s"/>
      <circle class="s" cx="20" cy="140" r="1" style="animation-delay:-3.1s"/>
    </g>

    <!-- sol neón -->
    <circle cx="900" cy="240" r="175" fill="url(#sunGlow)" class="pulse"/>
    <circle cx="900" cy="240" r="115" fill="url(#sun)" mask="url(#sunCut)"/>
    <rect y="190" width="1200" height="110" fill="url(#haze)"/>

    <!-- ciudad de fondo -->
    <use href="#backCity" fill="#1f2335"/>
    <use href="#backCity" fill="url(#winB)"/>

    <!-- torre -->
    <g stroke="#f7768e" stroke-width="1.4" stroke-linejoin="round" filter="url(#soft)">
      <path fill="#1a1b26" fill-rule="evenodd" d="M1084 300 L1106 214 L1111 172 L1115 132 L1116 112 L1120 112 L1121 132 L1125 172 L1130 214 L1152 300 Z M1098 300 Q1118 252 1138 300 Z"/>
      <rect x="1097" y="208" width="42" height="8" fill="#1a1b26"/>
      <rect x="1105" y="166" width="26" height="6" fill="#1a1b26"/>
      <g stroke-opacity=".6" stroke-width="1">
        <path d="M1092 270 L1144 270 M1100 240 L1136 240 M1109 190 L1127 190 M1113 150 L1123 150 M1092 270 L1136 240 M1144 270 L1100 240"/>
      </g>
      <path d="M1118 112 L1118 92"/>
    </g>
    <circle cx="1118" cy="92" r="2.6" fill="#ff007c" class="beacon" filter="url(#glow)"/>

    <!-- ciudad de frente -->
    <use href="#frontCity" fill="#13141c"/>
    <use href="#frontCity" fill="url(#winF)"/>

    <!-- letreros de neón -->
    <g class="neon" filter="url(#soft)">
      <rect x="704" y="234" width="30" height="58" rx="3" fill="#0f0f17" stroke="#ff007c" stroke-width="1.5"/>
      <text x="719" y="259" text-anchor="middle" font-size="20" font-weight="700" class="jp" fill="#ff007c">東</text>
      <text x="719" y="285" text-anchor="middle" font-size="20" font-weight="700" class="jp" fill="#ff007c">京</text>
    </g>
    <g filter="url(#soft)">
      <rect x="942" y="240" width="40" height="16" rx="2" fill="#0f0f17" stroke="#7dcfff" stroke-width="1.2"/>
      <text x="962" y="252.5" text-anchor="middle" font-size="12" font-weight="800" class="sans" fill="#7dcfff">C#</text>
    </g>

    <!-- horizonte y cuadrícula -->
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#ff007c" stroke-width="1.6" opacity=".9" filter="url(#soft)"/>
    <g clip-path="url(#groundClip)" stroke="#bb9af7" stroke-width="1" opacity=".45">
      <path d="M600 300 L-840 360 M600 300 L-720 360 M600 300 L-600 360 M600 300 L-480 360 M600 300 L-360 360 M600 300 L-240 360 M600 300 L-120 360 M600 300 L0 360 M600 300 L120 360 M600 300 L240 360 M600 300 L360 360 M600 300 L480 360 M600 300 L600 360 M600 300 L720 360 M600 300 L840 360 M600 300 L960 360 M600 300 L1080 360 M600 300 L1200 360 M600 300 L1320 360 M600 300 L1440 360 M600 300 L1560 360 M600 300 L1680 360 M600 300 L1800 360 M600 300 L1920 360 M600 300 L2040 360"/>
      <line x1="0" x2="1200" y1="300" y2="300">
        <animate attributeName="y1" values="300;360" dur="4s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
        <animate attributeName="y2" values="300;360" dur="4s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
      </line>
      <line x1="0" x2="1200" y1="300" y2="300">
        <animate attributeName="y1" values="300;360" dur="4s" begin="-0.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
        <animate attributeName="y2" values="300;360" dur="4s" begin="-0.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
      </line>
      <line x1="0" x2="1200" y1="300" y2="300">
        <animate attributeName="y1" values="300;360" dur="4s" begin="-1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
        <animate attributeName="y2" values="300;360" dur="4s" begin="-1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
      </line>
      <line x1="0" x2="1200" y1="300" y2="300">
        <animate attributeName="y1" values="300;360" dur="4s" begin="-2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
        <animate attributeName="y2" values="300;360" dur="4s" begin="-2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
      </line>
      <line x1="0" x2="1200" y1="300" y2="300">
        <animate attributeName="y1" values="300;360" dur="4s" begin="-3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
        <animate attributeName="y2" values="300;360" dur="4s" begin="-3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
      </line>
    </g>
    <rect y="300" width="1200" height="16" fill="url(#groundFade)"/>

    <!-- textos -->
    <text x="62" y="84" font-size="15" letter-spacing="4" fill="#565f89" class="mono"><tspan class="jp">ようこそ</tspan>  //  WELCOME</text>
    <text x="56" y="172" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#title)" class="sans" filter="url(#glow)">TokyoDev</text>
    <text x="62" y="214" font-size="25" class="jp" fill="#bb9af7">東京開発者<tspan class="sans" fill="#565f89"> · </tspan><tspan class="sans" fill="#c0caf5" font-weight="600">Jhosep S.</tspan></text>
    <text x="62" y="246" font-size="16" class="mono" fill="#7dcfff"><tspan fill="#9ece6a">$</tspan> dotnet run --modo=nocturno<tspan class="blink" fill="#c0caf5">▌</tspan></text>
  </g>
</svg>
