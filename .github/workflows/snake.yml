# Genera la serpiente que se "come" tu gráfica de contribuciones.
# Corre sola cada 12 horas, cada vez que subes cambios a main,
# o a mano desde la pestaña Actions -> "Serpiente de contribuciones" -> Run workflow.
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar la serpiente con colores Tokyo Night
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-tokyo-dark.svg?color_snake=#ff007c&color_dots=#1f2335,#2e3c64,#3d59a1,#7aa2f7,#bb9af7
            dist/snake-tokyo-light.svg?color_snake=#bb9af7&color_dots=#ebedf0,#c6d4f7,#9fb5f3,#7aa2f7,#3d59a1

      - name: Publicar los SVG en la rama "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
